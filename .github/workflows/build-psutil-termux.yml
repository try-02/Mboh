name: Build Android psutil wheel for Hermes Termux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-psutil:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Prepare output and builder script
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          chmod 0777 "$GITHUB_WORKSPACE/wheelhouse"
          cat > "$RUNNER_TEMP/build-psutil.sh" <<'SCRIPT'
          set -eu

          pkg update
          pkg install -y python git clang make pkg-config coreutils
          python -m pip install --upgrade setuptools wheel packaging

          python - <<'PY'
          import sys
          import sysconfig
          from packaging.tags import sys_tags

          print("Python:", sys.version)
          print("Platform:", sys.platform)
          print("Python platform:", sysconfig.get_platform())
          if sys.version_info[:2] != (3, 14):
              raise SystemExit("Expected CPython 3.14 in the Termux build container")
          if sys.platform != "android":
              raise SystemExit("Build must run inside Termux/Android userspace")
          if sysconfig.get_platform() != "android-24-arm64_v8a":
              raise SystemExit("Unexpected Python build platform")
          if not any(str(tag) == "cp314-cp314-android_24_arm64_v8a" for tag in sys_tags()):
              raise SystemExit("The build interpreter does not accept the target Android wheel tag")
          PY

          COMMIT="380bd2b59c67b0e1b04bbf3a90b11744f4f96644"
          SRC_DIR="$PREFIX/tmp/psutil-src"
          mkdir -p "$PREFIX/tmp" /out
          rm -rf "$SRC_DIR"
          git clone https://github.com/giampaolo/psutil.git "$SRC_DIR"
          git -C "$SRC_DIR" checkout --detach "$COMMIT"

          ACTUAL_COMMIT="$(git -C "$SRC_DIR" rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$COMMIT" ]; then
              echo "ERROR: psutil checkout does not match the locked commit" >&2
              exit 1
          fi

          cd "$SRC_DIR"
          export ANDROID_API_LEVEL=24
          # Build in Termux/Bionic; do not compile on the Ubuntu host.
          python -m pip wheel \
            --no-deps \
            --no-build-isolation \
            --wheel-dir=/out \
            .

          BUILT="$(find /out -maxdepth 1 -type f -name 'psutil-8.0.0-*.whl' -print -quit)"
          if [ -z "$BUILT" ]; then
              echo "ERROR: psutil 8.0.0 wheel was not produced" >&2
              ls -la /out
              exit 1
          fi

          case "$BUILT" in
              *-cp314-cp314-android_24_arm64_v8a.whl) ;;
              *)
                  wheel tags \
                    --python-tag=cp314 \
                    --abi-tag=cp314 \
                    --platform-tag=android_24_arm64_v8a \
                    --remove "$BUILT"
                  ;;
          esac

          FINAL_WHEEL="$(find /out -maxdepth 1 -type f -name 'psutil-8.0.0-cp314-cp314-android_24_arm64_v8a.whl' -print -quit)"
          if [ -z "$FINAL_WHEEL" ]; then
              echo "ERROR: expected Android wheel tag was not produced" >&2
              ls -la /out
              exit 1
          fi

          python -m pip install --no-deps --force-reinstall "$FINAL_WHEEL"
          python - <<'PY'
          import psutil
          import sys
          import sysconfig

          assert psutil.__version__ == "8.0.0", psutil.__version__
          assert isinstance(psutil.disk_partitions(all=True), list)
          assert psutil.Process().pid > 0
          print("psutil import and Android disk_partitions smoke test: OK")
          print("psutil version:", psutil.__version__)
          print("Python:", sys.version.split()[0])
          print("Platform:", sysconfig.get_platform())
          PY

          cd /out
          sha256sum "$(basename "$FINAL_WHEEL")" > SHA256SUMS
          printf 'Locked source commit: %s\n' "$COMMIT" > SOURCE_COMMIT.txt
          ls -lh /out
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/build-psutil.sh"

      - name: Build and test inside Termux userspace
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/wheelhouse:/out" \
            --volume "$RUNNER_TEMP/build-psutil.sh:/tmp/build-psutil.sh:ro" \
            termux/termux-docker@sha256:3a0a340fca9947f7139a0d695f1234edf0172daed6a2f1e0b1413ef91453c9ce \
            bash /tmp/build-psutil.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: psutil-8.0.0-cp314-android_24_arm64_v8a
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 14
