name: Build Zerostack Termux Native

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Runner native ARM64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Direktori Output & Hak Akses
        run: |
          mkdir -p output
          chmod -R 777 "${{ github.workspace }}"

      - name: Compile Zerostack di dalam Termux Docker (Patched TLS)
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            termux/termux-docker:aarch64 \
            sh -c '
              # 1. Update dan pasang build toolchain
              apt update && apt upgrade -y && \
              apt install -y rust git clang pkg-config openssl binutils make && \

              # 2. Clone repo Zerostack ke direktori internal Termux
              cd /data/data/com.termux/files/home && \
              git clone --depth 1 https://github.com/gi-dellav/zerostack.git && \
              git clone --depth 1 https://github.com/try-02/Mboh.git && \
              cp Mboh/zero/data/prompts/* zerostack/data/prompts/ && \
              cp Mboh/zero/src/agent/tools/* zerostack/src/agent/tools/ && \
              cp Mboh/zero/src/startup.rs zerostack/src/ && \
              cp Mboh/zero/src/extras/subagents/task_tool.rs zerostack/src/extras/subagents/ && \
              cp Mboh/zero/src/agent/prompt.rs zerostack/src/agent/ && \
              cd zerostack && \

              # 3. Vendor dependencies ke folder lokal
              cargo vendor --all-features vendor && \

              # 4. Arahkan Cargo untuk memakai dependensi lokal
              mkdir -p .cargo && \
              printf "[source.crates-io]\nreplace-with = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"vendor\"\n" > .cargo/config.toml && \

              # 5. Patch rustls-platform-verifier: nonaktifkan target android (pakai fallback Linux/UNIX)
              find vendor/rustls-platform-verifier -type f -exec sed -i "s/\"android\"/\"disabled_android\"/g; s/ANDROID/DISABLED_ANDROID/g" {} + && \

              # 6. Bypass checksum Cargo agar modifikasi diizinkan
              for f in vendor/*/.cargo-checksum.json; do
                sed -i "s/\"files\":{[^}]*}/\"files\":{}/" "$f"
              done && \

              # 7. Kompilasi mode release
              cargo build --release --all-features && \

              # 8. Pangkas ukuran file (strip)
              strip target/release/zerostack && \

              # 9. Salin binary ke output
              cp target/release/zerostack /workspace/output/zerostack
            '

      - name: Perbaiki Izin File Output
        if: always()
        run: sudo chown -R $USER:$USER "${{ github.workspace }}"

      - name: Kompres Binary
        run: |
          cd output
          tar -czvf ../zerostack-aarch64-termux.tar.gz zerostack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerostack-aarch64-termux
          path: zerostack-aarch64-termux.tar.gz
