name: Build jiter wheel for Termux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jiter:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Prepare artifact directory and builder script
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          chmod 0777 "$GITHUB_WORKSPACE/wheelhouse"
          cat > "$RUNNER_TEMP/build-jiter.sh" <<'SCRIPT'
          set -eu

          pkg update
          pkg upgrade -y
          pkg install -y python rust clang make pkg-config maturin curl coreutils tar

          python -m pip install --upgrade setuptools wheel
          export ANDROID_API_LEVEL=24
          export CARGO_BUILD_JOBS=2

          python - <<'PY'
          import sys
          import sysconfig
          from packaging.tags import sys_tags
          print("Python:", sys.version)
          print("Platform:", sysconfig.get_platform())
          if sys.version_info[:2] != (3, 14):
              raise SystemExit("Expected CPython 3.14 in the Termux build container")
          if not any(str(tag) == "cp314-cp314-android_24_arm64_v8a" for tag in sys_tags()):
              raise SystemExit("The build interpreter does not accept the target Android wheel tag")
          PY

          SDIST="$PREFIX/tmp/jiter-0.17.0.tar.gz"
          URL="https://files.pythonhosted.org/packages/9c/1f/8176d92e001f86505424b41664032ae26a882bc9ca41a32c803f373f9195/jiter-0.17.0.tar.gz"
          EXPECTED_SHA256="03e432f226a453851079fb84cd17c6da9991eab723e28d716f14ae3d906e0c12"

          curl -fL --retry 3 "$URL" -o "$SDIST"
          printf "%s  %s\n" "$EXPECTED_SHA256" "$SDIST" | sha256sum -c -

          SRC_DIR="$PREFIX/tmp/jiter_src"
          mkdir -p "$SRC_DIR"
          tar -xzf "$SDIST" -C "$SRC_DIR" --strip-components=1
          cd "$SRC_DIR"

          maturin build \
            --release \
            --strip \
            --out /out \
            --interpreter python

          BUILT="$(find /out -maxdepth 1 -type f -name "jiter-0.17.0-*.whl" -print -quit)"
          if [ -z "$BUILT" ]; then
              echo "ERROR: jiter wheel was not produced" >&2
              ls -la /out
              exit 1
          fi

          case "$BUILT" in
              *-cp314-cp314-android_24_arm64_v8a.whl) ;;
              *)
                  wheel tags \
                    --python-tag=cp314 \
                    --abi-tag=cp314 \
                    --platform-tag=android_24_arm64_v8a \
                    --remove "$BUILT"
                  ;;
          esac

          FINAL_WHEEL="$(find /out -maxdepth 1 -type f -name "jiter-0.17.0-cp314-cp314-android_24_arm64_v8a.whl" -print -quit)"
          if [ -z "$FINAL_WHEEL" ]; then
              echo "ERROR: expected Android wheel tag was not produced" >&2
              ls -la /out
              exit 1
          fi

          python -m pip install --no-deps --force-reinstall "$FINAL_WHEEL"
          python - <<'PY'
          import sys
          import sysconfig
          import jiter

          # Smoke test parsing JSON menggunakan jiter
          parsed = jiter.from_json(b'{"status": "ok", "value": 42}')
          assert parsed == {"status": "ok", "value": 42}
          print("jiter import and json parsing: OK")
          print("Python:", sys.version.split()[0])
          print("Platform:", sysconfig.get_platform())
          PY

          cd /out
          sha256sum "$(basename "$FINAL_WHEEL")" > SHA256SUMS
          ls -lh /out
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/build-jiter.sh"

      - name: Build and smoke-test in Termux userspace
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/wheelhouse:/out" \
            --volume "$RUNNER_TEMP/build-jiter.sh:/tmp/build-jiter.sh:ro" \
            termux/termux-docker@sha256:3a0a340fca9947f7139a0d695f1234edf0172daed6a2f1e0b1413ef91453c9ce \
            bash /tmp/build-jiter.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiter-0.17.0-cp314-android_24_arm64_v8a
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 14