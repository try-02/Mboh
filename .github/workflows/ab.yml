name: termux-wheels-stub

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit NousResearch/hermes-agent"
        default: "main"

permissions:
  contents: write

jobs:
  wheelhouse:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Build wheelhouse di Termux-Docker
        run: |
          mkdir -p out && chmod 777 out
          cat > build.sh <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get -y -o Dpkg::Options::=--force-confnew upgrade
          apt-get -y install python git clang make cmake pkg-config rust \
            libffi openssl libxml2 libxslt libheif libjpeg-turbo libpng freetype libwebp \
            littlecms libtiff openjpeg

          python - <<'PY'
          import sys, sysconfig
          print(sys.version, sys.platform, sysconfig.get_platform())
          assert sys.version_info[:2] == (3, 14), "Python bukan 3.14"
          PY

          export ANDROID_API_LEVEL=24
          export HERMES_NIX_BUILD=1

          python -m venv "$HOME/b"
          . "$HOME/b/bin/activate"
          pip install -U pip wheel setuptools build

          # =====================================================================
          # 1. BUAT STUB WHEEL UNTUK NEMO-RELAY (Murni Python / No-Op)
          # =====================================================================
          mkdir -p "$HOME/nemo_stub" && cd "$HOME/nemo_stub"
          cat > pyproject.toml <<'PYP'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "nemo-relay"
          version = "0.11.1"
          description = "Stub nemo-relay untuk Termux/Android"
          dependencies = []
          PYP

          mkdir -p nemo_relay
          cat > nemo_relay/__init__.py <<'PYP'
          __version__ = "0.11.1"

          class _NoOp:
              def __getattr__(self, name): return _NoOp()
              def __call__(self, *args, **kwargs): return _NoOp()
              def __enter__(self): return self
              def __exit__(self, *args): pass
              async def __aenter__(self): return self
              async def __aexit__(self, *args): pass

          scope = _NoOp()
          tools = _NoOp()
          llm = _NoOp()
          codecs = _NoOp()
          plugin = _NoOp()
          subscribers = _NoOp()

          class ToolExecutionResult(dict):
              def __init__(self, data=None, **kwargs):
                  super().__init__()
                  if data: self.update(data)
                  self.update(kwargs)

          class ScopeType:
              Agent = "agent"
              Tool = "tool"
              LLM = "llm"
          PYP
          python -m build --wheel --outdir /out
          cd "$HOME"

          # =====================================================================
          # 2. BUAT SHIM WHEEL UNTUK PRIMP (Pengganti Rust dengan HTTPX)
          # =====================================================================
          mkdir -p "$HOME/primp_shim" && cd "$HOME/primp_shim"
          cat > pyproject.toml <<'PYP'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "primp"
          version = "1.3.1"
          description = "Pure Python shim primp berbasis HTTPX untuk Termux"
          dependencies = ["httpx>=0.25.0"]
          PYP

          mkdir -p primp
          cat > primp/__init__.py <<'PYP'
          import httpx

          class ResponseWrapper:
              def __init__(self, resp: httpx.Response):
                  self._resp = resp
                  self.status_code = resp.status_code
                  self.text = resp.text
                  self.content = resp.content
                  self.headers = resp.headers
                  self.url = str(resp.url)
                  self.cookies = resp.cookies
              def json(self):
                  return self._resp.json()

          class Client:
              def __init__(self, *args, **kwargs):
                  headers = kwargs.get("headers") or {}
                  if isinstance(headers, dict):
                      headers = dict(headers)
                  headers.setdefault("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36")
                  self._client = httpx.Client(
                      headers=headers,
                      proxy=kwargs.get("proxy"),
                      timeout=kwargs.get("timeout", 10.0),
                      follow_redirects=kwargs.get("follow_redirects", True),
                      verify=kwargs.get("verify", True)
                  )
              def get(self, url, **kwargs):
                  # Filter argumen spesifik primp jika ada
                  kwargs.pop("impersonate", None)
                  return ResponseWrapper(self._client.get(url, **kwargs))
              def post(self, url, **kwargs):
                  kwargs.pop("impersonate", None)
                  return ResponseWrapper(self._client.post(url, **kwargs))
              def close(self):
                  self._client.close()
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  self.close()

          class AsyncClient:
              def __init__(self, *args, **kwargs):
                  headers = kwargs.get("headers") or {}
                  if isinstance(headers, dict):
                      headers = dict(headers)
                  headers.setdefault("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36")
                  self._client = httpx.AsyncClient(
                      headers=headers,
                      proxy=kwargs.get("proxy"),
                      timeout=kwargs.get("timeout", 10.0),
                      follow_redirects=kwargs.get("follow_redirects", True),
                      verify=kwargs.get("verify", True)
                  )
              async def get(self, url, **kwargs):
                  kwargs.pop("impersonate", None)
                  r = await self._client.get(url, **kwargs)
                  return ResponseWrapper(r)
              async def post(self, url, **kwargs):
                  kwargs.pop("impersonate", None)
                  r = await self._client.post(url, **kwargs)
                  return ResponseWrapper(r)
              async def aclose(self):
                  await self._client.aclose()
              async def __aenter__(self):
                  return self
              async def __aexit__(self, *args):
                  await self.aclose()
          PYP
          python -m build --wheel --outdir /out
          cd "$HOME"

          # =====================================================================
          # 3. PATCH BROWSER-HARNESS (Pillow compatibility)
          # =====================================================================
          mkdir -p "$HOME/bh_tmp" && cd "$HOME/bh_tmp"
          pip download "browser-harness==0.1.13" --no-deps
          python -m wheel unpack browser_harness-*.whl
          rm -f *.whl
          sed -i -E 's/[pP]illow==12\.3\.0/Pillow>=12.3.0/g' browser_harness-0.1.13/browser_harness-0.1.13.dist-info/METADATA
          python -m wheel pack --dest-dir /out --build-number 1 browser_harness-0.1.13

          # =====================================================================
          # 4. RESOLVE & BUILD SELURUH DEPENDENCIES
          # =====================================================================
          cp -r /src "$HOME/src"
          cd "$HOME/src"

          # Pip otomatis memilih wheel nemo-relay dan primp yang sudah ada di /out
          pip wheel ".[termux-all,exa,firecrawl,ddgs]" -w /out --find-links /out

          # Download tools backend untuk setup lokal
          pip download "setuptools==84.1.0" wheel --no-deps -d /out

          rm -f /out/hermes_agent-*.whl
          ls -1 /out
          EOF

          docker run --rm \
            -v "$PWD/src:/src:ro" \
            -v "$PWD/out:/out" \
            -v "$PWD/build.sh:/build.sh:ro" \
            termux/termux-docker:aarch64 bash /build.sh

      - name: Kemas dan publikasikan ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out | wc -l
          tar -C out -czf wheelhouse.tar.gz .
          gh release delete wheelhouse-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create wheelhouse-latest wheelhouse.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Termux wheelhouse (cp314, android_24_arm64_v8a)" \
            --notes "hermes-agent ref: ${{ inputs.ref }}"