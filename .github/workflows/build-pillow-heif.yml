name: Build pillow-heif wheel for Termux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pillow-heif:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Prepare artifact directory and builder script
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          chmod 0777 "$GITHUB_WORKSPACE/wheelhouse"
          cat > "$RUNNER_TEMP/build-pillow-heif.sh" <<'SCRIPT'
          set -eu

          pkg update
          pkg upgrade -y
          # Pasang clang, make, pkg-config, libheif (library native), dan python-pillow
          pkg install -y python clang make pkg-config libheif python-pillow curl coreutils tar

          python -m pip install --upgrade setuptools wheel packaging
          export ANDROID_API_LEVEL=24
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"

          python - <<'PY'
          import sys
          import sysconfig
          from packaging.tags import sys_tags
          print("Python:", sys.version)
          print("Platform:", sysconfig.get_platform())
          if sys.version_info[:2] != (3, 14):
              raise SystemExit("Expected CPython 3.14 in the Termux build container")
          if not any(str(tag) == "cp314-cp314-android_24_arm64_v8a" for tag in sys_tags()):
              raise SystemExit("The build interpreter does not accept the target Android wheel tag")
          PY

          SDIST="$PREFIX/tmp/pillow_heif-1.8.1.tar.gz"
          URL="https://files.pythonhosted.org/packages/44/c1/82145984920ca055675af2c2795bd30da6f7461215c41f3c1eacb3d66353/pillow_heif-1.8.1.tar.gz"
          EXPECTED_SHA256="521ebffb8a181d56c3904e5a61f20903edee0d9d3275967b8fb345f866215c06"

          curl -fL --retry 3 "$URL" -o "$SDIST"
          printf "%s  %s\n" "$EXPECTED_SHA256" "$SDIST" | sha256sum -c -

          # Build wheel langsung dari tarball sdist
          python -m pip wheel \
            --no-deps \
            --no-build-isolation \
            --wheel-dir=/out \
            "$SDIST"

          # Pindah ke /out agar tidak berada di direktori temporary manapun saat testing
          cd /out

          BUILT="$(find /out -maxdepth 1 -type f \( -name "pillow_heif-1.8.1-*.whl" -o -name "pillow-heif-1.8.1-*.whl" \) -print -quit)"
          if [ -z "$BUILT" ]; then
              echo "ERROR: pillow-heif wheel was not produced" >&2
              ls -la /out
              exit 1
          fi

          case "$BUILT" in
              *-cp314-cp314-android_24_arm64_v8a.whl) ;;
              *)
                  wheel tags \
                    --python-tag=cp314 \
                    --abi-tag=cp314 \
                    --platform-tag=android_24_arm64_v8a \
                    --remove "$BUILT"
                  ;;
          esac

          FINAL_WHEEL="$(find /out -maxdepth 1 -type f \( -name "pillow_heif-1.8.1-cp314-cp314-android_24_arm64_v8a.whl" -o -name "pillow-heif-1.8.1-cp314-cp314-android_24_arm64_v8a.whl" \) -print -quit)"
          if [ -z "$FINAL_WHEEL" ]; then
              echo "ERROR: expected Android wheel tag was not produced" >&2
              ls -la /out
              exit 1
          fi

          python -m pip install --no-deps --force-reinstall "$FINAL_WHEEL"
          python - <<'PY'
          import sys
          import sysconfig
          from PIL import Image
          import pillow_heif
          from pillow_heif import register_heif_opener

          # Uji integrasi plugin HEIF ke Pillow
          register_heif_opener()
          assert hasattr(pillow_heif, '__version__')
          assert pillow_heif.is_supported(b"") is False

          print("pillow-heif version:", pillow_heif.__version__)
          print("pillow-heif import and Pillow plugin registration: OK")
          print("Python:", sys.version.split()[0])
          print("Platform:", sysconfig.get_platform())
          PY

          sha256sum "$(basename "$FINAL_WHEEL")" > SHA256SUMS
          ls -lh /out
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/build-pillow-heif.sh"

      - name: Build and smoke-test in Termux userspace
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/wheelhouse:/out" \
            --volume "$RUNNER_TEMP/build-pillow-heif.sh:/tmp/build-pillow-heif.sh:ro" \
            termux/termux-docker@sha256:3a0a340fca9947f7139a0d695f1234edf0172daed6a2f1e0b1413ef91453c9ce \
            bash /tmp/build-pillow-heif.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillow_heif-1.8.1-cp314-android_24_arm64_v8a
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 14