name: Build watchfiles wheel for Termux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-watchfiles:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Prepare artifact directory and builder script
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          chmod 0777 "$GITHUB_WORKSPACE/wheelhouse"
          cat > "$RUNNER_TEMP/build-watchfiles.sh" <<'SCRIPT'
          set -eu

          pkg update
          pkg upgrade -y
          pkg install -y python rust clang make pkg-config maturin curl coreutils tar

          # anyio dipasang agar impor modul watchfiles saat smoke-test tidak gagal
          python -m pip install --upgrade setuptools wheel anyio packaging
          export ANDROID_API_LEVEL=24
          export CARGO_BUILD_JOBS=2

          python - <<'PY'
          import sys
          import sysconfig
          from packaging.tags import sys_tags
          print("Python:", sys.version)
          print("Platform:", sysconfig.get_platform())
          if sys.version_info[:2] != (3, 14):
              raise SystemExit("Expected CPython 3.14 in the Termux build container")
          if not any(str(tag) == "cp314-cp314-android_24_arm64_v8a" for tag in sys_tags()):
              raise SystemExit("The build interpreter does not accept the target Android wheel tag")
          PY

          SDIST="$PREFIX/tmp/watchfiles-1.3.0.tar.gz"
          URL="https://files.pythonhosted.org/packages/b3/68/e6aa0b77d217b31f8f486ec0cdfe5e00e6e38dc0be657e7d85819b9faf0a/watchfiles-1.3.0.tar.gz"
          EXPECTED_SHA256="99aee4a07847c06820765fd7b1b49ceac4f3f711ccb7d104655a33231de1c207"

          curl -fL --retry 3 "$URL" -o "$SDIST"
          printf "%s  %s\n" "$EXPECTED_SHA256" "$SDIST" | sha256sum -c -

          SRC_DIR="$PREFIX/tmp/watchfiles_src"
          mkdir -p "$SRC_DIR"
          tar -xzf "$SDIST" -C "$SRC_DIR" --strip-components=1
          cd "$SRC_DIR"

          # watchfiles dibuat dengan Rust & maturin
          maturin build \
            --release \
            --strip \
            --out /out \
            --interpreter python

          BUILT="$(find /out -maxdepth 1 -type f -name "watchfiles-1.3.0-*.whl" -print -quit)"
          if [ -z "$BUILT" ]; then
              echo "ERROR: watchfiles wheel was not produced" >&2
              ls -la /out
              exit 1
          fi

          case "$BUILT" in
              *-cp314-cp314-android_24_arm64_v8a.whl) ;;
              *)
                  wheel tags \
                    --python-tag=cp314 \
                    --abi-tag=cp314 \
                    --platform-tag=android_24_arm64_v8a \
                    --remove "$BUILT"
                  ;;
          esac

          FINAL_WHEEL="$(find /out -maxdepth 1 -type f -name "watchfiles-1.3.0-cp314-cp314-android_24_arm64_v8a.whl" -print -quit)"
          if [ -z "$FINAL_WHEEL" ]; then
              echo "ERROR: expected Android wheel tag was not produced" >&2
              ls -la /out
              exit 1
          fi

          python -m pip install --no-deps --force-reinstall "$FINAL_WHEEL"
          python - <<'PY'
          import sys
          import sysconfig
          import watchfiles
          from watchfiles import watch, Change

          assert hasattr(watchfiles, '__version__')
          print("watchfiles version:", watchfiles.__version__)
          print("watchfiles import and basic symbols: OK")
          print("Python:", sys.version.split()[0])
          print("Platform:", sysconfig.get_platform())
          PY

          cd /out
          sha256sum "$(basename "$FINAL_WHEEL")" > SHA256SUMS
          ls -lh /out
          SCRIPT
          chmod 0755 "$RUNNER_TEMP/build-watchfiles.sh"

      - name: Build and smoke-test in Termux userspace
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/wheelhouse:/out" \
            --volume "$RUNNER_TEMP/build-watchfiles.sh:/tmp/build-watchfiles.sh:ro" \
            termux/termux-docker@sha256:3a0a340fca9947f7139a0d695f1234edf0172daed6a2f1e0b1413ef91453c9ce \
            bash /tmp/build-watchfiles.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchfiles-1.3.0-cp314-android_24_arm64_v8a
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 14